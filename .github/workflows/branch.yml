name: Build and push branch image to registry
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
env:
  IMAGE_NAME: 'web/bibliotheca/mutual'
  REGISTRY_URL: ${{ secrets.HARBOR_URL }}

permissions:
  contents: read
  security-events: write

jobs:
  build-push:
    runs-on: gha-runners-smartweb
    if: github.ref_type == 'branch' && github.ref_name != 'main'
    steps:
      - name: Build tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          # Docker tags only allow [A-Za-z0-9_.-], max 128 chars, no leading '.' or '-'
          # (120 leaves room for '-<short sha>')
          BRANCH_TAG=$(echo "${{ github.ref_name }}" | sed -e 's/[^A-Za-z0-9_.-]/-/g' -e 's/^[.-]*//' | cut -c1-120)
          {
            echo 'IMAGE_TAGS<<EOF'
            echo '${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:'$BRANCH_TAG
            echo '${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:'$BRANCH_TAG-$SHORT_SHA
            echo EOF
          } >> $GITHUB_ENV
      - name: Build push and notify
        uses: IMIO/gha/build-push-notify@v7
        with:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAGS: ${{ env.IMAGE_TAGS }}
          REGISTRY_URL: ${{ env.REGISTRY_URL}}
          REGISTRY_USERNAME: ${{ secrets.SMARTWEB_HARBOR_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.SMARTWEB_HARBOR_PASSWORD }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.SMARTWEB_MATTERMOST_WEBHOOK_URL }}
