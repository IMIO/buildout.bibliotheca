name: Promote staging to production
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

jobs:
  tag:
    environment:
      name: production
    runs-on: gha-runners-smartweb
    steps:
      - name: Tag and notify
        uses: IMIO/gha/tag-notify@v8
        with:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          IMAGE_TAG: ${{ vars.IMAGE_TAG_STAGING }}
          NEW_IMAGE_TAGS: |
            ${{ vars.IMAGE_TAG_PRODUCTION }}
            ${{ vars.IMAGE_TAG_PRODUCTION }}-${{ github.run_number }}
            ${{ github.ref_name }}
          REGISTRY_URL: ${{ secrets.HARBOR_URL }}
          REGISTRY_USERNAME: ${{ secrets.SMARTWEB_HARBOR_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.SMARTWEB_HARBOR_PASSWORD }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.SMARTWEB_MATTERMOST_WEBHOOK_URL }}
  deploy-on-k8s:
    environment: production
    runs-on: gha-runners-smartweb
    needs: [tag]
    steps:
      - name: Update Kubernetes tag in production
        uses: IMIO/gha/k8s-update-tag@v5
        with:
          TAG: ${{ github.ref_name }}
          REPO_TOKEN_NAME: ${{ secrets.BIBLIOTHECA_ARGOCD_TOKEN_NAME }}
          REPO_ACCESS_TOKEN: ${{ secrets.BIBLIOTHECA_ARGOCD_ACCESS_TOKEN }}
          REPO_URL: ${{ secrets.BIBLIOTHECA_ARGOCD_REPO_URL }}
          TARGET_BRANCH: main
          VALUES_FILE_PATH: prod/common/values.yaml
