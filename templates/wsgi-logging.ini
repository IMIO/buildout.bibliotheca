# Logging part of wsgi.ini: plone.recipe.zope2instance 9.1.0's default
# (default_wsgi_logging_ini_template) with the trace ID of the current request
# in both formatters (plone.observability TraceContextFormatter, 0 outside a
# request). Searching the logs for a trace ID then finds that request's lines.
# The recipe fills this file with Python string formatting: every percent sign
# of a log format is doubled, and comments must not contain one.
[loggers]
keys = root, plone, waitress.queue, waitress, wsgi

[handlers]
keys = console, accesslog, eventlog

[formatters]
keys = generic, message

[logger_root]
level = %(eventlog_level)s
handlers = %(root_handlers)s

[logger_plone]
level = %(eventlog_level)s
handlers = %(event_handlers)s
qualname = plone

[logger_waitress.queue]
level = INFO
handlers = eventlog
qualname = waitress.queue
propagate = 0

[logger_waitress]
level = %(eventlog_level)s
handlers = %(event_handlers)s
qualname = waitress

[logger_wsgi]
level = %(accesslog_level)s
handlers = accesslog
qualname = wsgi
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[handler_accesslog]
class = %(accesslog_handler)s
args = %(accesslog_args)s
kwargs = %(accesslog_kwargs)s
level = %(accesslog_level)s
formatter = message

[handler_eventlog]
class = %(eventlog_handler)s
args = %(eventlog_args)s
kwargs = %(eventlog_kwargs)s
level = NOTSET
formatter = generic

[formatter_generic]
class = plone.observability.logformat.TraceContextFormatter
format = %%(asctime)s %%(levelname)-7.7s [%%(name)s:%%(lineno)s][%%(threadName)s] trace_id=%%(otelTraceID)s %%(message)s

[formatter_message]
class = plone.observability.logformat.TraceContextFormatter
format = %%(message)s trace_id=%%(otelTraceID)s
