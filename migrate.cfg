# zodb-convert configuration: RelStorage (PostgreSQL) -> zodb-pgjsonb
#
# Source uses the RELSTORAGE_* environment variables, destination the
# PGJSONB_* and S3_* ones (use a different database than the source).
# Run inside the instance container:
#
#   bin/zodb-convert -w 4 --background-blobs migrate.cfg
#
# Resume an interrupted migration with --incremental.
%import zodb_pgjsonb

<source>
  <relstorage>
    read-only true
    shared-blob-dir true
    blob-dir /data/blobstorage
    <postgresql>
      dsn dbname='$(RELSTORAGE_DB)' user='$(RELSTORAGE_USER)' host='$(RELSTORAGE_HOSTNAME)' port='$(RELSTORAGE_PORT)' password='$(RELSTORAGE_PASSWORD)'
    </postgresql>
  </relstorage>
</source>

<destination>
  <pgjsonb>
    dsn dbname='$(PGJSONB_DB)' user='$(PGJSONB_USER)' host='$(PGJSONB_HOSTNAME)' port='$(PGJSONB_PORT)' password='$(PGJSONB_PASSWORD)'
    # pool-max-size must exceed the number of zodb-convert workers (-w)
    pool-max-size 6
    blob-temp-dir /data/blobstorage/tmp
    blob-cache-dir /data/blobstorage/cache
    blob-threshold 64KB
    s3-bucket-name $(S3_BUCKET_NAME)
    s3-prefix $(PROJECT_ID)
    s3-endpoint-url $(S3_ENDPOINT_URL)
    s3-region $(S3_REGION)
    s3-access-key $(S3_ACCESS_KEY)
    s3-secret-key $(S3_SECRET_KEY)
    s3-use-ssl $(S3_USE_SSL)
  </pgjsonb>
</destination>
