[remotes]
imio = https://github.com/IMIO
imio_push = git@github.com:IMIO
collective = https://github.com/collective
collective_push = git@github.com:collective
plone = https://github.com/plone
plone_push = git@github.com:plone
remdub = https://github.com/remdub
remdub_push = git@github.com:remdub


[sources]
# from IMIO
bibliotheca.policy = git ${remotes:imio}/bibliotheca.policy.git pushurl=${remotes:imio_push}/bibliotheca.policy.git
bibliotheca.core = git ${remotes:imio}/bibliotheca.core.git pushurl=${remotes:imio_push}/bibliotheca.core.git
collective.upgrade = git ${remotes:collective}/collective.upgrade.git pushurl=${remotes:collective_push}/collective.upgrade.git branch=plone61
pas.plugins.kimug = git ${remotes:imio}/pas.plugins.kimug.git pushurl=${remotes:imio_push}/pas.plugins.kimug.git
# temporary, to be removed when PR is merged and plone.app.themingplugins is released
plone.app.themingplugins = git ${remotes:plone}/plone.app.themingplugins.git branch=master
# temporary, until a plone.observability release has TraceContextFormatter,
# which templates/wsgi-logging.ini needs
plone.observability = git ${remotes:remdub}/plone.observability.git pushurl=${remotes:remdub_push}/plone.observability.git branch=integration/log-trace-context-server-span-name