volumes:
  library-postgres:
  library-blobcache:
  library-garage-meta:
  library-garage-data:
services:
  instance:
    build:
      context: .
    image: imiobibliotheca
    ports:
      - 8080:8080
    links:
      - postgres:db
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      reverseproxy:
        condition: service_started
      jaeger:
        condition: service_started
    volumes:
      - library-blobcache:/data/blobstorage
    environment:
      - PLONE_EXTENSION_IDS=plone.app.caching:default,plonetheme.barceloneta:default,bibliotheca.policy:default,plone.pgcatalog:default
      - DEFAULT_LANGUAGE=fr
      - ACTIVE_BIGBANG=True
      - PGJSONB_HOSTNAME=db
      - PGJSONB_PORT=5432
      - PGJSONB_DB=${PGJSONB_DB:-library}
      - PGJSONB_USER=${PGJSONB_USER:-library}
      - PGJSONB_PASSWORD=${PGJSONB_PASSWORD:-library}
      - PGJSONB_CACHE_MB=256
      - PGJSONB_BLOB_CACHE_SIZE=1GB
      - S3_ENDPOINT_URL=http://garage:3900
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-zodb-blobs}
      - S3_REGION=garage
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_USE_SSL=false
      - PROJECT_ID=library
      - ZODB_CACHE_SIZE=30000
      # OpenTelemetry tracing (plone.observability), gRPC OTLP exporter
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=bibliotheca
      - PLONE_OBSERVABILITY_OTEL_INSTRUMENTORS=1
    command: fg
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.instance.rule=Host(`portal.localhost`)'
      - 'traefik.http.services.instance.loadbalancer.server.port=8080'
      - "traefik.http.routers.instance.middlewares=add-plone"
      - "traefik.http.middlewares.add-plone.addprefix.prefix=/VirtualHostBase/http/portal.localhost/Plone/VirtualHostRoot"
  postgres:
    image: postgres:17.6
    environment:
      - POSTGRES_DB=${PGJSONB_DB:-library}
      - POSTGRES_USER=${PGJSONB_USER:-library}
      - POSTGRES_PASSWORD=${PGJSONB_PASSWORD:-library}
    volumes:
      - library-postgres:/var/lib/postgresql/data
    healthcheck:
      # TCP check: the temporary server of the first-run initdb only listens
      # on the unix socket, so this waits for the real server
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      timeout: 5s
      retries: 15
  garage:
    # S3-compatible storage for blobs > 64KB. On first start it assigns a
    # single-node layout and creates the access key and bucket from the S3_*
    # variables.
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=${S3_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${S3_SECRET_KEY}
      - GARAGE_DEFAULT_BUCKET=${S3_BUCKET_NAME:-zodb-blobs}
    healthcheck:
      # the image has no shell, exec form only
      test:
        - CMD
        - /garage
        - bucket
        - info
        - ${S3_BUCKET_NAME:-zodb-blobs}
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - 3900:3900 # S3 API
      - 3903:3903 # admin API
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - library-garage-meta:/var/lib/garage/meta
      - library-garage-data:/var/lib/garage/data
    networks:
      default:
        aliases:
          # virtual-hosted style bucket address used by boto3
          - ${S3_BUCKET_NAME:-zodb-blobs}.garage
  jaeger:
    # OpenTelemetry collector and trace viewer
    image: jaegertracing/jaeger:2.21.0
    ports:
      - 16686:16686 # UI
      - 4317:4317 # OTLP gRPC
  reverseproxy:
    image: traefik
    command:
      - '--api.insecure=true'
      - '--providers.docker=true'
    ports:
      - '80:80' # The HTTP port
      - '8000:8080' # The Web UI (enabled by --api)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # So that Traefik can listen to the Docker events
