[buildout]
extends =
    backup.cfg
    base.cfg

allow-picked-versions = true

parts +=
    instance-debug
    zodbconvert

auto-checkout =
    collective.upgrade
    collective.preventactions
    collective.behavior.gallery
    plone.app.themingplugins

[instance]
http-address = 8080
zodb-cache-size = $(ZODB_CACHE_SIZE)
event-log-level = INFO
eggs +=
    zodb-pgjsonb[s3]

threads = 2
# zodb-pgjsonb storage: objects as JSONB in PostgreSQL, blobs < 64KB in PG
# bytea, larger blobs in S3. The recipe has no native support for it, so the
# whole <pgjsonb> section goes in storage-wrapper; the trailing "%.0s" swallows
# the default filestorage snippet the recipe would otherwise insert.
# Do not use any other literal percent sign in this option.
zope-conf-imports = zodb_pgjsonb
storage-wrapper =
    <pgjsonb>
      dsn dbname='$(PGJSONB_DB)' user='$(PGJSONB_USER)' host='$(PGJSONB_HOSTNAME)' port='$(PGJSONB_PORT)' password='$(PGJSONB_PASSWORD)'
      pool-size 2
      pool-max-size 6
      cache-shared-mb $(PGJSONB_CACHE_MB)
      blob-temp-dir /data/blobstorage/tmp
      blob-cache-dir /data/blobstorage/cache
      blob-cache-size $(PGJSONB_BLOB_CACHE_SIZE)
      blob-threshold 64KB
      s3-bucket-name $(S3_BUCKET_NAME)
      s3-prefix $(PROJECT_ID)
      s3-endpoint-url $(S3_ENDPOINT_URL)
      s3-region $(S3_REGION)
      s3-access-key $(S3_ACCESS_KEY)
      s3-secret-key $(S3_SECRET_KEY)
      s3-use-ssl $(S3_USE_SSL)
    </pgjsonb>
    %.0s

[instance-debug]
<= instance
debug-mode = on
verbose-security = on
event-log-level = INFO
eggs =
    ${instance:eggs}
    ${debug-products:eggs}
zcml =
    ${instance:zcml}

event-log-custom =
    <logfile>
        path /data/log/${:_buildout_section_name_}.log
        level debug
    </logfile>

# Tools to migrate RelStorage -> zodb-pgjsonb (bin/zodb-convert migrate.cfg)
# and to pack the database (bin/zodbpack pack.cfg).
[zodbconvert]
recipe = zc.recipe.egg
eggs =
    zodb-convert
    zodb-pgjsonb[s3]
    RelStorage[postgresql]
    psycopg2
scripts =
    zodb-convert
    zodbpack
